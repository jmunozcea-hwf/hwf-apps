</style>
<script>/* patch_menusel: grupos de filtros → menú desplegable */
(function () {
  const SEL = '.seg, .pr-chips, .cx-chips, .rk-seg, .pra-seg, .pt-seg, .db-seg, .ad-seg, .nu-tabs, .tc-tabs, .t-seg, #prFil, #prSegF, #cxFil, #cxSegF, #invSeg, #proSeg, #bnSegAp, [role=tablist]';
  const FUERA = "#masSeg, #snPanel, #snPanLog, nav, .modos, #tNav, .ms-hoja, header, .auth-body, #auth, .login";
  const activo = b => b.getAttribute("aria-pressed") === "true" || b.getAttribute("aria-selected") === "true" || /(^|\s)(on|act|activo|active|sel)(\s|$)/.test(b.className);
  const botones = g => [...g.children].filter(b => b.tagName === "BUTTON" && b.style.display !== "none" && !b.hidden);
  const txt = b => (b.textContent || "").replace(/\s+/g, " ").trim();
  let nc = 0;
  const cont = b => { const c = b.cloneNode(true); let h = c.innerHTML; nc++;
    [...c.querySelectorAll("[id]")].forEach(x => { const id = x.id, nu = id + "-ms" + nc; h = h.split('id="' + id + '"').join('id="' + nu + '"').split("#" + id + ")").join("#" + nu + ")"); });
    return h; };
  function titulo(g) {
    const l = g.getAttribute("aria-label"); if (l) return l;
    let p = g.previousElementSibling; while (p && p.classList.contains("ms-btn")) p = p.previousElementSibling;
    if (p && /^(H2|H3|LABEL)$/.test(p.tagName) && txt(p).length < 40) return txt(p);
    return "Ver";
  }
  let velo, hoja, abierto = null;
  function cerrar() { if (!hoja) return; hoja.classList.remove("on"); velo.classList.remove("on"); setTimeout(() => { if (!abierto) { velo.remove(); hoja.remove(); velo = hoja = null; } }, 230); abierto = null; }
  function abrir(g, btn) {
    if (!velo) { velo = document.createElement("div"); velo.className = "ms-velo"; velo.onclick = cerrar; hoja = document.createElement("div"); hoja.className = "ms-hoja"; hoja.setAttribute("role", "dialog"); hoja.setAttribute("aria-modal", "true"); document.body.append(velo, hoja); }
    abierto = g; const bs = botones(g);
    hoja.innerHTML = `<div class="ms-asa"></div><h3>${btn.querySelector("small").textContent}</h3>` + bs.map((b, i) => `<button type="button" class="ms-op" data-i="${i}" aria-current="${activo(b)}">${cont(b)}${activo(b) ? '<span class="ms-ok">✓</span>' : ""}</button>`).join("");
    hoja.querySelectorAll(".ms-op").forEach(o => o.onclick = () => { const b = bs[Number(o.dataset.i)]; cerrar(); if (b && b.isConnected) b.click(); setTimeout(() => pintar(g), 30); });
    requestAnimationFrame(() => { velo.classList.add("on"); hoja.classList.add("on"); const a = hoja.querySelector('[aria-current="true"]'); if (a) a.focus(); });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && abierto) cerrar(); });
  function pintar(g) {
    const btn = g._msBtn; if (!btn) return; const bs = botones(g); const a = bs.filter(activo);
    const b = a[0] || bs[0]; if (!b) return;
    btn.querySelector("b").innerHTML = cont(b);
    btn.querySelector(".ms-n").textContent = bs.length + " opciones";
  }
  function convertir(g) {
    if (g._msBtn || g.closest(FUERA) || g.closest(".ms-oc")) return;
    const bs = botones(g); if (bs.length < 2 || bs.filter(activo).length > 1 || bs.length !== g.children.length) return;
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "ms-btn"; btn.setAttribute("aria-haspopup", "dialog");
    btn.innerHTML = `<span class="ms-t"><small>${titulo(g).replace(/[<>&]/g, "")}</small><b></b></span><span class="ms-n"></span><span class="ms-a">▼</span>`;
    btn.onclick = () => abrir(g, btn);
    g._msBtn = btn; g.parentNode.insertBefore(btn, g); g.classList.add("ms-oc");
    new MutationObserver(() => pintar(g)).observe(g, { subtree: true, childList: true, attributes: true, attributeFilter: ["aria-pressed", "aria-selected", "class"] });
    pintar(g);
  }
  function aplicar() {
    try {
      document.querySelectorAll(".ms-btn").forEach(b => { const g = b.nextElementSibling; if (!g || g._msBtn !== b) b.remove(); });
      document.querySelectorAll(SEL).forEach(convertir);
    } catch (e) {}
  }
  aplicar(); setTimeout(aplicar, 500); setTimeout(aplicar, 1600);
  let pend = false; new MutationObserver(() => { if (pend) return; pend = true; setTimeout(() => { pend = false; aplicar(); }, 60); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
<script>/* patch_pares: última tarjeta sola en su fila → ancho completo */
(function () {
  const FUERA = "nav, #snPanel, #snPanLog, .modos, #masSeg, .ms-hoja, table, .cal-it, header";
  let sels = null;
  function selectores() {
    const s = new Set(['[style*="grid"]']);
    const rec = rs => { for (const r of rs) { try { if (r.cssRules && !r.selectorText) rec(r.cssRules); else if (r.style && /grid/.test(r.style.display || "")) r.selectorText.split(",").forEach(x => { x = x.trim(); if (x && !/:/.test(x)) s.add(x); }); } catch (e) {} } };
    for (const ss of document.styleSheets) { try { rec(ss.cssRules); } catch (e) {} }
    return [...s].join(",");
  }
  function aplicar() {
    try {
      if (!sels) sels = selectores();
      document.querySelectorAll("[data-par]").forEach(e => { e.style.gridColumn = ""; e.removeAttribute("data-par"); });
      document.querySelectorAll(sels).forEach(g => {
        if (g.closest(FUERA)) return;
        const cs = getComputedStyle(g); if (cs.display !== "grid") return;
        const cols = cs.gridTemplateColumns.split(" ").filter(Boolean); if (cols.length < 2) return;
        const w = cols.map(parseFloat); if (!w.every(x => Math.abs(x - w[0]) < 2)) return;
        const hs = [...g.children].filter(c => c.offsetParent !== null && getComputedStyle(c).position !== "absolute");
        if (hs.length < 2) return;
        const filas = {}; hs.forEach(c => { const k = Math.round(c.offsetTop / 4); (filas[k] = filas[k] || []).push(c); });
        Object.values(filas).forEach(f => { if (f.length !== 1) return; const c = f[0]; if (c.offsetWidth > g.clientWidth * .7) return;
          c.style.gridColumn = "1 / -1"; c.setAttribute("data-par", ""); });
      });
    } catch (e) {}
  }
  let pend = false; const prog = () => { if (pend) return; pend = true; setTimeout(() => { pend = false; aplicar(); }, 120); };
  prog(); setTimeout(prog, 1500);
  new MutationObserver(m => { if (m.every(x => x.type === "attributes" && x.attributeName === "data-par")) return; prog(); }).observe(document.body, { childList: true, subtree: true });
  addEventListener("resize", prog);
})();
</script>
