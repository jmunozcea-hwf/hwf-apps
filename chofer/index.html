<!doctype html><html lang="es-CL"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHOFER HWF</title>
<meta name="apple-mobile-web-app-title" content="CHOFER"><meta name="theme-color" content="#0B3146"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
:root{--navy:#0B3146;--oro:#F0A818;--verde:#1C7A4E;--rojo:#B42318;--bg:#F2F5F7;--ink:#0F1E29;--muted:#5B6874;--line:#DAE1E7;--sunk:#EEF2F5}
*{box-sizing:border-box}html,body{margin:0}body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(78px + env(safe-area-inset-bottom))}
.top{background:linear-gradient(120deg,#0B3146,#1F5673);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:1.1rem}.top small{display:block;opacity:.85;font-size:.76rem}.gp{margin-left:auto;border-radius:999px;padding:4px 10px;font-size:.74rem;font-weight:800;background:rgba(255,255,255,.15);white-space:nowrap}
.gp.ok{background:#1C7A4E}.gp.bad{background:#B42318}
nav.bn{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav.bn button{border:0;background:none;font:inherit;font-size:.72rem;font-weight:700;color:var(--muted);padding:7px 2px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer}
nav.bn .ic{width:32px;height:32px}nav.bn .ic svg{width:100%;height:100%;display:block}nav.bn button[aria-current="true"]{color:var(--navy)}nav.bn button[aria-current="true"] .ic{outline:2px solid var(--oro);outline-offset:1px;border-radius:10px}
main{max-width:720px;margin:0 auto;padding:12px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(11,49,70,.08)}
.card h2{margin:0 0 8px;font-size:1.05rem}.muted{color:var(--muted)}.nota{font-size:.8rem;color:var(--muted);margin:6px 0 0}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.ver{background:var(--verde);color:#fff;border-color:var(--verde)}.btn.oro{background:var(--oro);color:#0B3146;border-color:var(--oro)}.btn:disabled{opacity:.5}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;width:100%}
label.f{display:grid;gap:4px;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:10px}
.sig{position:relative;border:2px dashed var(--line);border-radius:14px;background:#fff;touch-action:none}.sig canvas{display:block;width:100%;height:190px;border-radius:12px}.sig span{position:absolute;left:12px;bottom:8px;font-size:.75rem;color:var(--muted);pointer-events:none}
.nx{border:2px solid var(--oro);background:#FFFBF0}.nx .t{font-size:.72rem;font-weight:800;color:#9A5B00;text-transform:uppercase;letter-spacing:.04em}
.nx h3{margin:2px 0 4px;font-size:1.15rem}.it{font-size:.82rem;color:var(--muted);margin:6px 0}
.pd{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.pd:last-child{border-bottom:0}
.pd .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.8rem;background:var(--sunk)}.pd .n.ok{background:#1C7A4E;color:#fff}.pd .n.bad{background:#B42318;color:#fff}.pd .n.wa{background:#F0A818;color:#0B3146}
.pd small{display:block;color:var(--muted);font-size:.78rem}.pill{border-radius:999px;padding:2px 8px;font-size:.72rem;font-weight:800}.p-ok{background:#E3F4EA;color:var(--verde)}.p-bad{background:#FDE7E4;color:var(--rojo)}.p-wa{background:#FFF1DC;color:#9A5B00}.p-n{background:var(--sunk);color:var(--muted)}
.ests{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}.ests button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font:inherit;font-size:.86rem;font-weight:800;cursor:pointer}
.ests button[aria-pressed="true"]{border-color:var(--navy);background:#E6EEF3}
.th{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.th div{position:relative}.th img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.th button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#B42318;color:#fff;font-weight:800;cursor:pointer}
#mapa{height:calc(100vh - 230px);min-height:320px;border-radius:14px}
.k{background:var(--sunk);border-radius:12px;padding:10px}.k span{display:block;font-size:.7rem;text-transform:uppercase;font-weight:800;color:var(--muted)}.k b{display:block;font-size:1.25rem}
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(16px + env(safe-area-inset-bottom))}.ov .in{max-width:640px;margin:0 auto}
.gate{position:fixed;inset:0;z-index:120;background:linear-gradient(140deg,#0B3146,#1F5673);display:grid;place-items:center;padding:16px}.gate .c{background:#fff;border-radius:18px;padding:20px;max-width:440px;width:100%;display:grid;gap:10px}
.gate h1{margin:0;font-size:1.2rem}.gate .e{color:var(--rojo);font-size:.85rem;min-height:1em}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#0F1E29;color:#fff;padding:10px 16px;border-radius:12px;z-index:200;max-width:90vw}
[hidden]{display:none!important}
</style></head><body>
<div class="top"><div><h1>🚚 CHOFER HWF</h1><small id="tSub">—</small></div><span class="gp" id="gps">GPS…</span></div>
<main><section id="s-ruta"></section><section id="s-mapa" hidden><div class="card" style="padding:8px"><div id="mapa"></div></div></section><section id="s-resumen" hidden></section></main>
<nav class="bn" id="nav"><button type="button" data-s="ruta"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cruta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5673"/><stop offset="1" stop-color="#0B3146"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cruta)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></g></svg></span>Ruta</button><button type="button" data-s="mapa"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cmapa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A6B"/><stop offset="1" stop-color="#D9483B"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cmapa)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></g></svg></span>Mapa</button><button type="button" data-s="resumen"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cresumen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FBF7F"/><stop offset="1" stop-color="#1C7A4E"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cresumen)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v1.5M12 16v1.5"/></g></svg></span>Resumen</button></nav><div class="toast" id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-CL"), nf = (n, d) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: d || 0 });
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem("hwf-cho:" + k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem("hwf-cho:" + k, JSON.stringify(v)); return true; } catch (e) { toast("Memoria del teléfono llena: envía las entregas pendientes con señal."); return false; } };
let tT; function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 3500); }
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const CHOFERES = ["Víctor", "Matías", "Jorge", "Cristóbal", "Claudia", "Diego"];
const VEH = [["hd65", "Hyundai HD65 MAX"], ["boxer", "Peugeot Boxer L2H2"], ["g10", "Maxus G10 Cargo"], ["partner", "Peugeot Partner L2"]];
const PAGOS = ["Efectivo", "Transferencia", "Cheque", "Tarjeta (POS)", "Crédito / factura a plazo", "Sin cobro (ya pagado)"];
const ESTADOS = [["ok", "✅ Entregado conforme"], ["parcial", "🟡 Entrega parcial"], ["rech", "❌ Rechazado"], ["aus", "🚪 No estaba / cerrado"]];
const ESTXT = Object.fromEntries(ESTADOS.map(([k, t]) => [k, t.replace(/^\S+\s/, "")]));

/* ===== conexión ===== */
const cfg = () => lsGet("cfg", null);
async function api(d) { const c = cfg(); if (!c) return { ok: false, error: "Sin conexión configurada." };
  try { const r = await fetch(c.url, { method: "POST", body: JSON.stringify(Object.assign({ clave: c.clave }, d)) }); const o = JSON.parse(await r.text());
    if (o && o.ok === false && (o.clave === false || /clave no coincide/i.test(o.error || ""))) { localStorage.removeItem("hwf-cho:cfg"); alert("La clave ya no es la del script de Google. Vuelve a conectar."); location.reload(); }
    return o; } catch (e) { return { ok: false, red: true, error: "Sin señal o el script no respondió." }; } }
function dec(t) { t = String(t || "").replace(/\s+/g, ""); try { t = decodeURIComponent(t); } catch (e) {} const m = t.match(/HWF1:([A-Za-z0-9+\/=_-]+)/); if (!m) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); return o.u && o.c ? { url: o.u, clave: o.c } : null; } catch (e) { return null; } }
function puerta(modo) { document.querySelectorAll(".gate").forEach(x => x.remove()); const o = document.createElement("div"); o.className = "gate"; const p = lsGet("perfil", {}) || {};   /* patch_chofernombre */
  const LH = (String(location.hash).match(/HWF1:[A-Za-z0-9+\/=_%-]+/) || [])[0]; if (LH) { const c0 = dec(LH); if (c0) lsSet("cfg", c0); try { history.replaceState(null, "", location.pathname); } catch (e) {} }
  const nomOk = s => String(s || "").trim().replace(/\s+/g, " ").toLowerCase().replace(/(^|\s)([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase());
  if (modo === "veh") { const R = rutaHoy(), con = R ? [...new Set((R.ruta.rutas || []).map(r => r.veh))] : [], L = VEH.slice().sort((a, b) => (con.includes(b[0]) ? 1 : 0) - (con.includes(a[0]) ? 1 : 0));
    o.innerHTML = `<div class="c"><h1>🚚 Hola, ${esc(p.chofer || "")}</h1><p class="muted" style="margin:0">¿Qué vehículo llevas hoy?</p>
      <div style="display:grid;gap:8px">${L.map(([k, n]) => `<button type="button" class="btn${con.includes(k) ? " pri" : ""}" data-veh="${k}" style="justify-content:space-between">${esc(n)}${con.includes(k) ? " <small>ruta de hoy</small>" : ""}</button>`).join("")}</div>
      <label class="f">Kilometraje al salir (opcional)<input id="gO" type="number" inputmode="numeric" placeholder="Ej.: 125430"></label><div class="e" id="gE"></div></div>`;
    document.body.appendChild(o);
    o.querySelectorAll("[data-veh]").forEach(b => b.onclick = () => { const P = Object.assign({}, perfil() || {}, { veh: b.dataset.veh, fecha: hoy() }); lsSet("perfil", P); const vd = lsGet("vehDe", {}) || {}; vd[P.chofer] = P.veh; lsSet("vehDe", vd); jornadaIniciar($("gO").value); o.remove(); arrancar(); });
    return; }
  o.innerHTML = `<div class="c"><h1>🚚 Chofer HWF</h1><label class="f">Tu nombre<input id="gN" list="gNl" autocomplete="name" autocapitalize="words" placeholder="Escribe tu nombre" value="${esc(p.chofer || "")}"></label>
    <datalist id="gNl">${CHOFERES.map(n => `<option value="${esc(n)}">`).join("")}</datalist>
    ${cfg() ? "" : `<details id="gCx"><summary style="cursor:pointer;font-weight:600">Este teléfono aún no está conectado</summary><p class="muted" style="margin:6px 0">Abre el link que te mandó logística por WhatsApp, o pégalo aquí (una sola vez).</p>
      <textarea id="gC" rows="3" placeholder="Link o código HWF1:…"></textarea></details>`}
    <div class="e" id="gE"></div><button type="button" class="btn pri" id="gB">Entrar</button></div>`;
  document.body.appendChild(o);
  const entrar = () => { if (!cfg()) { const c = dec(($("gC") || {}).value || ""); if (!c) { $("gE").textContent = "Falta conectar este teléfono: abre el link que te mandó logística."; const d = $("gCx"); if (d) d.open = true; return; } lsSet("cfg", c); }
    const n = nomOk($("gN").value); if (n.length < 2) { $("gE").textContent = "Escribe tu nombre."; return; }
    const R = rutaHoy(), con = R ? [...new Set((R.ruta.rutas || []).map(r => r.veh))] : [], vd = lsGet("vehDe", {}) || {}, veh = (p.chofer === n && p.veh) || vd[n] || (con.length === 1 ? con[0] : "");
    lsSet("perfil", { chofer: n, veh, fecha: hoy() }); o.remove(); if (veh) { jornadaIniciar(""); arrancar(); } else puerta("veh"); };
  $("gB").onclick = entrar; $("gN").onkeydown = e => { if (e.key === "Enter") entrar(); }; }
const perfil = () => lsGet("perfil", null), vehNom = id => (VEH.find(v => v[0] === id) || [id, id])[1];

/* ===== ruta del día ===== */
const rutaHoy = () => { const R = lsGet("ruta", null); return R && R.fecha === hoy() ? R : null; };
function misParadas() { const R = rutaHoy(), P = perfil(); if (!R || !P) return { paradas: [], origen: null };
  const mias = (R.ruta.rutas || []).filter(r => r.veh === P.veh).sort((a, b) => (a.vuelta || 1) - (b.vuelta || 1)); let n = 0;
  return { paradas: mias.flatMap(r => r.paradas.map(p => Object.assign({ vuelta: r.vuelta || 1, ord: ++n }, p))), origen: (mias[0] && mias[0].origen) || null, km: mias.reduce((t, r) => t + (r.km || 0), 0), vueltas: mias.length }; }
async function bajarRuta(silencio) { const r = await api({ accion: "rutaLeer", fecha: hoy() });
  if (r.ok && r.ruta) { lsSet("ruta", { fecha: hoy(), ruta: r.ruta }); if (!silencio) toast("Ruta del día actualizada."); return true; }
  if (!silencio) toast(r.ok ? "Logística aún no envía la ruta de hoy." : r.error); return false; }
const estados = () => lsGet("est_" + hoy(), {});

/* ===== GPS ===== */
let POS = null, ultEnvio = 0, ultPos = null, watch = null;
function gpsIniciar() { if (!navigator.geolocation) { $("gps").textContent = "Sin GPS"; $("gps").className = "gp bad"; return; }
  watch = navigator.geolocation.watchPosition(p => { POS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, vel: p.coords.speed || 0, t: Date.now() };
      $("gps").textContent = "GPS activo"; $("gps").className = "gp ok"; jornadaKm(POS); gpsEnviar(); if (miMarca) miMarca.setLatLng([POS.lat, POS.lng]); },
    () => { $("gps").textContent = "GPS apagado"; $("gps").className = "gp bad"; }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 }); }
function dist(a, b) { const r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng), s = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(s)); }
async function gpsEnviar(forzar) { const P = perfil(); if (!POS || !P || !navigator.onLine) return; const mov = ultPos ? dist(ultPos, POS) : 1e9;
  if (!forzar && Date.now() - ultEnvio < 120000 && mov < 300) return; ultEnvio = Date.now(); ultPos = POS;
  await api({ accion: "gps", veh: P.veh, chofer: P.chofer, lat: POS.lat, lng: POS.lng, acc: POS.acc, vel: POS.vel }); }
let wl = null; async function pantallaEncendida() { try { if ("wakeLock" in navigator && !document.hidden) wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pantallaEncendida(); gpsEnviar(true); enviarCola(); } });

/* ===== registro diario de conducción ===== */
const jornada = () => lsGet("jornada", null), hhmm = () => new Date().toTimeString().slice(0, 5);
function jornadaIniciar(odo) { const P = perfil(), J = jornada();
  if (J && J.activa && J.fecha === hoy() && J.chofer === P.chofer && J.veh === P.veh) return;
  if (J && J.activa) jornadaCerrar({ obs: "Cerrada al cambiar de chofer o vehículo" });
  const N = { id: "J" + P.veh + "-" + Date.now().toString(36), fecha: hoy(), chofer: P.chofer, veh: P.veh, vehNombre: vehNom(P.veh), inicio: hhmm(), fin: "", horas: 0, kmGps: 0, odoIni: odo === "" || odo == null ? "" : Number(odo) || "", odoFin: "", kmOdo: 0, entregas: "", cobrado: 0, litros: 0, comb: 0, obs: "", activa: true, t0: Date.now() };
  lsSet("jornada", N); jornadaEnviar(N); }
function jornadaStats() { const X = misParadas(), E = estados(), L = Object.values(E); return { entregas: `${L.filter(e => e.est === "ok" || e.est === "parcial").length} de ${X.paradas.length}`, cobrado: L.reduce((t, e) => t + (e.monto || 0), 0) }; }
function jornadaCerrar(d) { const J = jornada(); if (!J || !J.activa) return; const st = jornadaStats();
  Object.assign(J, st, d || {}, { fin: hhmm(), horas: +((Date.now() - (J.t0 || Date.now())) / 3600000).toFixed(2), activa: false });
  if (J.odoIni !== "" && J.odoFin !== "" && J.odoFin != null) J.kmOdo = Math.max(0, Number(J.odoFin) - Number(J.odoIni)); J.kmGps = +(J.kmGps || 0).toFixed(1); lsSet("jornada", J); jornadaEnviar(J); }
function jornadaEnviar(J) { const Q = lsGet("colaJ", {}); const x = Object.assign({}, J); delete x.ult; delete x.t0; Q[J.id] = x; lsSet("colaJ", Q); enviarCola(); }
function jornadaKm(pos) { const J = jornada(); if (!J || !J.activa || pos.acc > 100) return; if (J.ult) { const d = dist(J.ult, pos); if (d < 40) return; if (d < 5000) J.kmGps = (J.kmGps || 0) + d / 1000; } J.ult = { lat: pos.lat, lng: pos.lng }; lsSet("jornada", J); }

/* ===== cola de entregas (funciona sin señal) ===== */
const cola = () => lsGet("cola", []);
let enviando = false;
async function enviarCola() { if (enviando || !navigator.onLine) return; enviando = true;
  for (const id of Object.keys(lsGet("colaJ", {}))) { const j = lsGet("colaJ", {})[id]; const r = await api({ accion: "jornada", jornada: j }); if (r.ok) { const Q = lsGet("colaJ", {}); if (Q[id] === undefined || JSON.stringify(Q[id]) === JSON.stringify(j)) { delete Q[id]; lsSet("colaJ", Q); } } else break; }
  const C = cola(); if (!C.length) { enviando = false; return pintarCola(); }
  for (const e of C) { const r = await api({ accion: "entrega", entrega: e }); if (r.ok) { lsSet("cola", cola().filter(x => x.id !== e.id)); } else if (!r.red) { toast("No se pudo enviar: " + r.error); break; } else break; }
  enviando = false; pintarCola(); if (SEC === "resumen") pintarResumen(); }
function pintarCola() { const n = cola().length, s = $("tSub"), P = perfil(), J = jornada(); if (s && P) s.textContent = `${P.chofer} · ${vehNom(P.veh)}${J && J.activa ? ` · desde ${J.inicio} · ${nf(J.kmGps, 1)} km` : ""}${n ? ` · ${n} por enviar` : ""}`; }
setInterval(enviarCola, 60000); window.addEventListener("online", enviarCola);

<script>/* patch_pares: última tarjeta sola en su fila → ancho completo */
(function () {
  const FUERA = "nav, #snPanel, #snPanLog, .modos, #masSeg, .ms-hoja, table, .cal-it, header";
  let sels = null;
  function selectores() {
    const s = new Set(['[style*="grid"]']);
    const rec = rs => { for (const r of rs) { try { if (r.cssRules && !r.selectorText) rec(r.cssRules); else if (r.style && /grid/.test(r.style.display || "")) r.selectorText.split(",").forEach(x => { x = x.trim(); if (x && !/:/.test(x)) s.add(x); }); } catch (e) {} } };
    for (const ss of document.styleSheets) { try { rec(ss.cssRules); } catch (e) {} }
    return [...s].join(",");
  }
  function aplicar() {
    try {
      if (!sels) sels = selectores();
      document.querySelectorAll("[data-par]").forEach(e => { e.style.gridColumn = ""; e.removeAttribute("data-par"); });
      document.querySelectorAll(sels).forEach(g => {
        if (g.closest(FUERA)) return;
        const cs = getComputedStyle(g); if (cs.display !== "grid") return;
        const cols = cs.gridTemplateColumns.split(" ").filter(Boolean); if (cols.length < 2) return;
        const w = cols.map(parseFloat); if (!w.every(x => Math.abs(x - w[0]) < 2)) return;
        const hs = [...g.children].filter(c => c.offsetParent !== null && getComputedStyle(c).position !== "absolute");
        if (hs.length < 2) return;
        const ult = hs[hs.length - 1], top = ult.offsetTop;
        if (hs.filter(c => Math.abs(c.offsetTop - top) < 4).length !== 1) return;
        if (hs.length > 1 && Math.abs(hs[hs.length - 2].offsetTop - top) < 4) return;
        if (ult.offsetWidth > g.clientWidth * .7) return;
        ult.style.gridColumn = "1 / -1"; ult.setAttribute("data-par", "");
      });
    } catch (e) {}
  }
  let pend = false; const prog = () => { if (pend) return; pend = true; setTimeout(() => { pend = false; aplicar(); }, 120); };
  prog(); setTimeout(prog, 1500);
  new MutationObserver(m => { if (m.every(x => x.type === "attributes" && x.attributeName === "data-par")) return; prog(); }).observe(document.body, { childList: true, subtree: true });
  addEventListener("resize", prog);
})();

@media(min-width:700px){.ms-hoja{left:50%;right:auto;bottom:auto;top:50%;width:420px;border-radius:20px;transform:translate(-50%,-46%);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}.ms-hoja.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}.ms-hoja .ms-asa{display:none}.ms-btn{max-width:520px}}
</style>
<script>/* patch_menusel: grupos de filtros → menú desplegable */
(function () {
  const SEL = '.seg, .pr-chips, .cx-chips, .rk-seg, .pra-seg, .pt-seg, .db-seg, .ad-seg, .nu-tabs, .tc-tabs, .t-seg, #prFil, #prSegF, #cxFil, #cxSegF, #invSeg, #proSeg, #bnSegAp, [role=tablist]';
  const FUERA = "#masSeg, #snPanel, #snPanLog, nav, .modos, #tNav, .ms-hoja, header, .auth-body, #auth, .login";
  const activo = b => b.getAttribute("aria-pressed") === "true" || b.getAttribute("aria-selected") === "true" || /(^|\s)(on|act|activo|active|sel)(\s|$)/.test(b.className);
  const botones = g => [...g.children].filter(b => b.tagName === "BUTTON" && b.style.display !== "none" && !b.hidden);
  const txt = b => (b.textContent || "").replace(/\s+/g, " ").trim();
  let nc = 0;
  const cont = b => { const c = b.cloneNode(true); let h = c.innerHTML; nc++;
    [...c.querySelectorAll("[id]")].forEach(x => { const id = x.id, nu = id + "-ms" + nc; h = h.split('id="' + id + '"').join('id="' + nu + '"').split("#" + id + ")").join("#" + nu + ")"); });
    return h; };
  function titulo(g) {
    const l = g.getAttribute("aria-label"); if (l) return l;
    let p = g.previousElementSibling; while (p && p.classList.contains("ms-btn")) p = p.previousElementSibling;
    if (p && /^(H2|H3|LABEL)$/.test(p.tagName) && txt(p).length < 40) return txt(p);
    return "Ver";
  }
  let velo, hoja, abierto = null;
  function cerrar() { if (!hoja) return; hoja.classList.remove("on"); velo.classList.remove("on"); setTimeout(() => { if (!abierto) { velo.remove(); hoja.remove(); velo = hoja = null; } }, 230); abierto = null; }
  function abrir(g, btn) {
    if (!velo) { velo = document.createElement("div"); velo.className = "ms-velo"; velo.onclick = cerrar; hoja = document.createElement("div"); hoja.className = "ms-hoja"; hoja.setAttribute("role", "dialog"); hoja.setAttribute("aria-modal", "true"); document.body.append(velo, hoja); }
    abierto = g; const bs = botones(g);
    hoja.innerHTML = `<div class="ms-asa"></div><h3>${btn.querySelector("small").textContent}</h3>` + bs.map((b, i) => `<button type="button" class="ms-op" data-i="${i}" aria-current="${activo(b)}">${cont(b)}${activo(b) ? '<span class="ms-ok">✓</span>' : ""}</button>`).join("");
    hoja.querySelectorAll(".ms-op").forEach(o => o.onclick = () => { const b = bs[Number(o.dataset.i)]; cerrar(); if (b && b.isConnected) b.click(); setTimeout(() => pintar(g), 30); });
    requestAnimationFrame(() => { velo.classList.add("on"); hoja.classList.add("on"); const a = hoja.querySelector('[aria-current="true"]'); if (a) a.focus(); });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && abierto) cerrar(); });
  function pintar(g) {
    const btn = g._msBtn; if (!btn) return; const bs = botones(g); const a = bs.filter(activo);
    const b = a[0] || bs[0]; if (!b) return;
    btn.querySelector("b").innerHTML = cont(b);
    btn.querySelector(".ms-n").textContent = bs.length + " opciones";
  }
  function convertir(g) {
    if (g._msBtn || g.closest(FUERA) || g.closest(".ms-oc")) return;
    const bs = botones(g); if (bs.length < 2 || bs.filter(activo).length > 1 || bs.length !== g.children.length) return;
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "ms-btn"; btn.setAttribute("aria-haspopup", "dialog");
    btn.innerHTML = `<span class="ms-t"><small>${titulo(g).replace(/[<>&]/g, "")}</small><b></b></span><span class="ms-n"></span><span class="ms-a">▼</span>`;
    btn.onclick = () => abrir(g, btn);
    g._msBtn = btn; g.parentNode.insertBefore(btn, g); g.classList.add("ms-oc");
    new MutationObserver(() => pintar(g)).observe(g, { subtree: true, childList: true, attributes: true, attributeFilter: ["aria-pressed", "aria-selected", "class"] });
    pintar(g);
  }
  function aplicar() {
    try {
      document.querySelectorAll(".ms-btn").forEach(b => { const g = b.nextElementSibling; if (!g || g._msBtn !== b) b.remove(); });
      document.querySelectorAll(SEL).forEach(convertir);
    } catch (e) {}
  }
  aplicar(); setTimeout(aplicar, 500); setTimeout(aplicar, 1600);
  let pend = false; new MutationObserver(() => { if (pend) return; pend = true; setTimeout(() => { pend = false; aplicar(); }, 60); }).observe(document.body, { childList: true, subtree: true });
})();
</script>
</body></html>
