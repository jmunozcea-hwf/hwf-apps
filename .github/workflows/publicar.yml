# Publicación del sitio en GitHub Pages con flujo propio (10-11-2026).
# - Siempre gana el último push: los envíos intermedios en cola se descartan (nunca se publica una versión vieja encima).
# - Reintenta una vez si GitHub falla al publicar (como el timeout «syncing_files» del 10-11).
# - Verifica que version.json en línea sea el del commit publicado.
# Requiere: Settings → Pages → Build and deployment → Source: «GitHub Actions». Mientras siga en «Deploy from branch»
# este flujo no hace nada (lo detecta y termina en verde) y sigue publicando el modo antiguo.
name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  modo:
    runs-on: ubuntu-latest
    outputs:
      tipo: ${{ steps.m.outputs.tipo }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null || echo desconocido)
          echo "Modo de GitHub Pages: $t"
          echo "tipo=$t" >> "$GITHUB_OUTPUT"
  publicar:
    needs: modo
    if: needs.modo.outputs.tipo == 'workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: d1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 900000
      - id: d2
        if: steps.d1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
      - name: Verificar versión en línea
        run: |
          url="${{ steps.d1.outputs.page_url || steps.d2.outputs.page_url }}"
          esperada=$(python3 -c "import json;print(json.load(open('version.json'))['v'])" 2>/dev/null || echo "")
          [ -z "$esperada" ] && { echo "Sin version.json en el repo: no se verifica."; exit 0; }
          for i in $(seq 1 20); do
            enlinea=$(curl -fsS "${url}version.json?t=$(date +%s)" | python3 -c "import json,sys;print(json.load(sys.stdin)['v'])" 2>/dev/null || echo "")
            echo "Intento $i: en línea=$enlinea esperada=$esperada"
            [ "$enlinea" = "$esperada" ] && { echo "Publicado y verificado."; exit 0; }
            sleep 30
          done
          echo "::error::La versión en línea no coincide después de 10 minutos."; exit 1
