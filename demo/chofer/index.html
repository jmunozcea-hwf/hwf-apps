</style></head><body>
<div class="top"><div><h1>🚚 DEMO CHOFER</h1><small id="tSub">—</small></div><span class="gp" id="gps">GPS…</span></div>
<main><section id="s-ruta"></section><section id="s-mapa" hidden><div class="card" style="padding:8px"><div id="mapa"></div></div></section><section id="s-resumen" hidden></section></main>
<nav class="bn" id="nav"><button type="button" data-s="ruta"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cruta" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5673"/><stop offset="1" stop-color="#0B3146"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cruta)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></g></svg></span>Ruta</button><button type="button" data-s="mapa"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cmapa" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF8A6B"/><stop offset="1" stop-color="#D9483B"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cmapa)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></g></svg></span>Mapa</button><button type="button" data-s="resumen"><span class="ic"><svg viewBox="0 0 32 32" aria-hidden="true" class="hic"><defs><linearGradient id="hic-cresumen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FBF7F"/><stop offset="1" stop-color="#1C7A4E"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#hic-cresumen)"/><path d="M4 4h24v10C20 9 11 9 4 13z" fill="#fff" opacity=".12"/><g transform="translate(5.5 5.5) scale(.875)" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .8-3 2s1.3 1.7 3 2 3 .8 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v1.5M12 16v1.5"/></g></svg></span>Resumen</button></nav><div class="toast" id="toast" hidden></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = n => "$" + Math.round(Number(n) || 0).toLocaleString("es-CL"), nf = (n, d) => (Number(n) || 0).toLocaleString("es-CL", { maximumFractionDigits: d || 0 });
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem("hwf-chodemo:" + k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem("hwf-chodemo:" + k, JSON.stringify(v)); return true; } catch (e) { toast("Memoria del teléfono llena: envía las entregas pendientes con señal."); return false; } };
let tT; function toast(m) { const t = $("toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => t.hidden = true, 3500); }
const hoy = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const CHOFERES = ["Pedro", "Andrea", "Tomás", "Camila"];
const VEH = [["hd65", "Hyundai HD65 MAX"], ["boxer", "Peugeot Boxer L2H2"], ["g10", "Maxus G10 Cargo"], ["partner", "Peugeot Partner L2"]];
const PAGOS = ["Efectivo", "Transferencia", "Cheque", "Tarjeta (POS)", "Crédito / factura a plazo", "Sin cobro (ya pagado)"];
const ESTADOS = [["ok", "✅ Entregado conforme"], ["parcial", "🟡 Entrega parcial"], ["rech", "❌ Rechazado"], ["aus", "🚪 No estaba / cerrado"]];
const ESTXT = Object.fromEntries(ESTADOS.map(([k, t]) => [k, t.replace(/^\S+\s/, "")]));

/* ===== conexión ===== */
const cfg = () => lsGet("cfg", null);
async function api(d) { const c = cfg(); if (!c) return { ok: false, error: "Sin conexión configurada." };
  try { const r = await fetch(c.url, { method: "POST", body: JSON.stringify(Object.assign({ clave: c.clave }, d)) }); const o = JSON.parse(await r.text());
    if (o && o.ok === false && (o.clave === false || /clave no coincide/i.test(o.error || ""))) { localStorage.removeItem("hwf-chodemo:cfg"); alert("La clave ya no es la del script de Google. Vuelve a conectar."); location.reload(); }
    return o; } catch (e) { return { ok: false, red: true, error: "Sin señal o el script no respondió." }; } }
function dec(t) { t = String(t || "").replace(/\s+/g, ""); try { t = decodeURIComponent(t); } catch (e) {} const m = t.match(/HWF1:([A-Za-z0-9+\/=_-]+)/); if (!m) return null;
  try { const o = JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))))); return o.u && o.c ? { url: o.u, clave: o.c } : null; } catch (e) { return null; } }
function puerta() { const o = document.createElement("div"); o.className = "gate"; const p = lsGet("perfil", {});
  o.innerHTML = `<div class="c"><h1>🚚 DEMO CHOFER</h1>${cfg() ? "" : `<p class="muted" style="margin:0">Pega el link o el código de conexión (empieza con <b>HWF1:</b>) que te entrega logística.</p>
    <textarea id="gC" rows="3" placeholder="Link o código HWF1:…"></textarea><details><summary style="cursor:pointer;font-weight:600">Conectar con URL y clave</summary><div style="display:grid;gap:8px;margin-top:8px"><input id="gU" type="url" placeholder="https://script.google.com/macros/s/…/exec"><input id="gK" placeholder="Clave"></div></details>`}
    <label class="f">Chofer<select id="gN"><option value="">Elige tu nombre…</option>${CHOFERES.map(n => `<option${p.chofer === n ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    <label class="f">Vehículo de hoy<select id="gV">${VEH.map(([k, n]) => `<option value="${k}"${p.veh === k ? " selected" : ""}>${n}</option>`).join("")}</select></label>
    <label class="f">Kilometraje del odómetro al salir (opcional)<input id="gO" type="number" inputmode="numeric" placeholder="Ej.: 125430"></label>
    <div class="e" id="gE"></div><button type="button" class="btn pri" id="gB">Comenzar jornada</button><p class="muted" style="margin:0;font-size:.8rem">Queda en el registro diario de conducción: chofer, vehículo, hora de inicio y término, kilómetros y entregas.</p></div>`;
  document.body.appendChild(o);
  $("gB").onclick = () => { if (!cfg()) { let c = dec($("gC").value); const u = ($("gU").value || "").trim(), k = ($("gK").value || "").trim();
      if (!c && /^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u) && k.length >= 4) c = { url: u, clave: k }; if (!c) { $("gE").textContent = "Link, código o URL/clave no válido."; return; } lsSet("cfg", c); }
    const n = $("gN").value; if (!n) { $("gE").textContent = "Elige tu nombre."; return; }
    lsSet("perfil", { chofer: n, veh: $("gV").value, fecha: hoy() }); jornadaIniciar($("gO").value); o.remove(); arrancar(); };
  const LH = (String(location.hash).match(/HWF1:[A-Za-z0-9+\/=_%-]+/) || [])[0]; if (LH && $("gC")) { try { history.replaceState(null, "", location.pathname); } catch (e) {} $("gC").value = decodeURIComponent(LH); } }
const perfil = () => lsGet("perfil", null), vehNom = id => (VEH.find(v => v[0] === id) || [id, id])[1];

/* ===== ruta del día ===== */
const rutaHoy = () => { const R = lsGet("ruta", null); return R && R.fecha === hoy() ? R : null; };
function misParadas() { const R = rutaHoy(), P = perfil(); if (!R || !P) return { paradas: [], origen: null };
  const mias = (R.ruta.rutas || []).filter(r => r.veh === P.veh).sort((a, b) => (a.vuelta || 1) - (b.vuelta || 1)); let n = 0;
  return { paradas: mias.flatMap(r => r.paradas.map(p => Object.assign({ vuelta: r.vuelta || 1, ord: ++n }, p))), origen: (mias[0] && mias[0].origen) || null, km: mias.reduce((t, r) => t + (r.km || 0), 0), vueltas: mias.length }; }
async function bajarRuta(silencio) { const r = await api({ accion: "rutaLeer", fecha: hoy() });
  if (r.ok && r.ruta) { lsSet("ruta", { fecha: hoy(), ruta: r.ruta }); if (!silencio) toast("Ruta del día actualizada."); return true; }
  if (!silencio) toast(r.ok ? "Logística aún no envía la ruta de hoy." : r.error); return false; }
const estados = () => lsGet("est_" + hoy(), {});

/* ===== GPS ===== */
let POS = null, ultEnvio = 0, ultPos = null, watch = null;
function gpsIniciar() { if (!navigator.geolocation) { $("gps").textContent = "Sin GPS"; $("gps").className = "gp bad"; return; }
  watch = navigator.geolocation.watchPosition(p => { POS = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, vel: p.coords.speed || 0, t: Date.now() };
      $("gps").textContent = "GPS activo"; $("gps").className = "gp ok"; jornadaKm(POS); gpsEnviar(); if (miMarca) miMarca.setLatLng([POS.lat, POS.lng]); },
    () => { $("gps").textContent = "GPS apagado"; $("gps").className = "gp bad"; }, { enableHighAccuracy: true, maximumAge: 15000, timeout: 30000 }); }
function dist(a, b) { const r = x => x * Math.PI / 180, dl = r(b.lat - a.lat), dg = r(b.lng - a.lng), s = Math.sin(dl / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dg / 2) ** 2; return 12742000 * Math.asin(Math.sqrt(s)); }
async function gpsEnviar(forzar) { const P = perfil(); if (!POS || !P || !navigator.onLine) return; const mov = ultPos ? dist(ultPos, POS) : 1e9;
  if (!forzar && Date.now() - ultEnvio < 120000 && mov < 300) return; ultEnvio = Date.now(); ultPos = POS;
  await api({ accion: "gps", veh: P.veh, chofer: P.chofer, lat: POS.lat, lng: POS.lng, acc: POS.acc, vel: POS.vel }); }
let wl = null; async function pantallaEncendida() { try { if ("wakeLock" in navigator && !document.hidden) wl = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (!document.hidden) { pantallaEncendida(); gpsEnviar(true); enviarCola(); } });

/* ===== registro diario de conducción ===== */
const jornada = () => lsGet("jornada", null), hhmm = () => new Date().toTimeString().slice(0, 5);
function jornadaIniciar(odo) { const P = perfil(), J = jornada();
  if (J && J.activa && J.fecha === hoy() && J.chofer === P.chofer && J.veh === P.veh) return;
  if (J && J.activa) jornadaCerrar({ obs: "Cerrada al cambiar de chofer o vehículo" });
  const N = { id: "J" + P.veh + "-" + Date.now().toString(36), fecha: hoy(), chofer: P.chofer, veh: P.veh, vehNombre: vehNom(P.veh), inicio: hhmm(), fin: "", horas: 0, kmGps: 0, odoIni: odo === "" || odo == null ? "" : Number(odo) || "", odoFin: "", kmOdo: 0, entregas: "", cobrado: 0, litros: 0, comb: 0, obs: "", activa: true, t0: Date.now() };
  lsSet("jornada", N); jornadaEnviar(N); }
function jornadaStats() { const X = misParadas(), E = estados(), L = Object.values(E); return { entregas: `${L.filter(e => e.est === "ok" || e.est === "parcial").length} de ${X.paradas.length}`, cobrado: L.reduce((t, e) => t + (e.monto || 0), 0) }; }
function jornadaCerrar(d) { const J = jornada(); if (!J || !J.activa) return; const st = jornadaStats();
  Object.assign(J, st, d || {}, { fin: hhmm(), horas: +((Date.now() - (J.t0 || Date.now())) / 3600000).toFixed(2), activa: false });
  if (J.odoIni !== "" && J.odoFin !== "" && J.odoFin != null) J.kmOdo = Math.max(0, Number(J.odoFin) - Number(J.odoIni)); J.kmGps = +(J.kmGps || 0).toFixed(1); lsSet("jornada", J); jornadaEnviar(J); }
function jornadaEnviar(J) { const Q = lsGet("colaJ", {}); const x = Object.assign({}, J); delete x.ult; delete x.t0; Q[J.id] = x; lsSet("colaJ", Q); enviarCola(); }
function jornadaKm(pos) { const J = jornada(); if (!J || !J.activa || pos.acc > 100) return; if (J.ult) { const d = dist(J.ult, pos); if (d < 40) return; if (d < 5000) J.kmGps = (J.kmGps || 0) + d / 1000; } J.ult = { lat: pos.lat, lng: pos.lng }; lsSet("jornada", J); }

/* ===== cola de entregas (funciona sin señal) ===== */
const cola = () => lsGet("cola", []);
let enviando = false;
async function enviarCola() { if (enviando || !navigator.onLine) return; enviando = true;
  for (const id of Object.keys(lsGet("colaJ", {}))) { const j = lsGet("colaJ", {})[id]; const r = await api({ accion: "jornada", jornada: j }); if (r.ok) { const Q = lsGet("colaJ", {}); if (Q[id] === undefined || JSON.stringify(Q[id]) === JSON.stringify(j)) { delete Q[id]; lsSet("colaJ", Q); } } else break; }
  const C = cola(); if (!C.length) { enviando = false; return pintarCola(); }
  for (const e of C) { const r = await api({ accion: "entrega", entrega: e }); if (r.ok) { lsSet("cola", cola().filter(x => x.id !== e.id)); } else if (!r.red) { toast("No se pudo enviar: " + r.error); break; } else break; }
  enviando = false; pintarCola(); if (SEC === "resumen") pintarResumen(); }
function pintarCola() { const n = cola().length, s = $("tSub"), P = perfil(), J = jornada(); if (s && P) s.textContent = `${P.chofer} · ${vehNom(P.veh)}${J && J.activa ? ` · desde ${J.inicio} · ${nf(J.kmGps, 1)} km` : ""}${n ? ` · ${n} por enviar` : ""}`; }
setInterval(enviarCola, 60000); window.addEventListener("online", enviarCola);

/* ===== fotos y firma ===== */
function comprimir(file) { return new Promise(res => { const img = new Image(), u = URL.createObjectURL(file); img.onload = () => { const M = 1280, k = Math.min(1, M / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); res(c.toDataURL("image/jpeg", 0.6)); }; img.onerror = () => res(null); img.src = u; }); }
function firmaPad(cv) { const ctx = cv.getContext("2d"); let dib = false, vacio = true, last = null; const ajustar = () => { const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1; cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.scale(dpr, dpr); ctx.lineWidth = 2.4; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0B3146"; };
  ajustar(); const pt = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.onpointerdown = e => { dib = true; last = pt(e); cv.setPointerCapture(e.pointerId); }; cv.onpointermove = e => { if (!dib) return; const p = pt(e); ctx.beginPath(); ctx.moveTo(last[0], last[1]); ctx.lineTo(p[0], p[1]); ctx.stroke(); last = p; vacio = false; };
  cv.onpointerup = cv.onpointercancel = () => { dib = false; };
  return { limpiar: () => { ctx.clearRect(0, 0, cv.width, cv.height); vacio = true; }, vacio: () => vacio, png: () => { const c = document.createElement("canvas"); c.width = cv.width; c.height = cv.height; const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(cv, 0, 0); return c.toDataURL("image/png"); } }; }

/* ===== registrar entrega ===== */
function registrar(p) { const o = document.createElement("div"); o.className = "ov"; const fotos = []; let est = "ok";
  const iva = Math.round((p.monto || 0) * 1.19);
  o.innerHTML = `<div class="in"><div class="card"><h2>Entrega · ${esc(p.cli)}</h2><p class="muted" style="margin:0 0 8px">${esc(p.comuna)}${p.dir ? " · " + esc(p.dir) : ""}${p.num ? " · NP " + esc(p.num) : ""}</p>
      <div class="ests" id="eEst">${ESTADOS.map(([k, t]) => `<button type="button" data-e="${k}" aria-pressed="${k === est}">${t}</button>`).join("")}</div>
      <label class="f">📷 Fotos de la entrega (hasta 4)<input id="eFoto" type="file" accept="image/*" capture="environment" multiple></label><div class="th" id="eTh"></div>
      <div id="eRec"><label class="f">Recibe (nombre)<input id="eNom" placeholder="Nombre de quien recibe"></label><label class="f">RUT de quien recibe (opcional)<input id="eRut" placeholder="12.345.678-9"></label>
        <label class="f">✍️ Firma de recepción conforme</label><div class="sig"><canvas id="eSig"></canvas><span>Firme aquí con el dedo</span></div><div style="text-align:right;margin:4px 0 10px"><button type="button" class="btn" id="eLimp" style="min-height:34px;padding:6px 12px">Borrar firma</button></div>
        <div class="g2"><label class="f">💵 Forma de pago<select id="ePago">${PAGOS.map(x => `<option>${x}</option>`).join("")}</select></label><label class="f">Monto cobrado ($)<input id="eMon" type="number" inputmode="numeric" placeholder="0"></label></div>
        ${p.monto ? `<p class="nota" style="margin:-4px 0 10px">Pedido neto ${fmt(p.monto)} · con IVA ${fmt(iva)} <button type="button" class="btn" id="eIva" style="min-height:30px;padding:4px 10px;font-size:.8rem">Usar ${fmt(iva)}</button></p>` : ""}</div>
      <label class="f">Observación<textarea id="eObs" rows="2" placeholder="Ej.: faltó 1 saco, cliente pide cambio, dejó en bodega…"></textarea></label>
      <div class="g2"><button type="button" class="btn" id="eNo">Cancelar</button><button type="button" class="btn ver" id="eSi">Guardar entrega</button></div>
      <p class="nota">Se guarda con la hora y tu ubicación GPS. Sin señal queda en el teléfono y se envía sola.</p></div></div>`;
  document.body.appendChild(o); const pad = firmaPad($("eSig"));
  const pintEst = () => { o.querySelectorAll("#eEst [data-e]").forEach(b => b.setAttribute("aria-pressed", b.dataset.e === est)); $("eRec").hidden = est === "aus"; };
  $("eEst").onclick = e => { const b = e.target.closest("[data-e]"); if (b) { est = b.dataset.e; pintEst(); } };
  const pintTh = () => { $("eTh").innerHTML = fotos.map((f, i) => `<div><img src="${f}" alt="foto ${i + 1}"><button type="button" data-q="${i}">×</button></div>`).join(""); };
  $("eTh").onclick = e => { const b = e.target.closest("[data-q]"); if (b) { fotos.splice(+b.dataset.q, 1); pintTh(); } };
  $("eFoto").onchange = async () => { for (const f of [...$("eFoto").files]) { if (fotos.length >= 4) break; const d = await comprimir(f); if (d) fotos.push(d); } $("eFoto").value = ""; pintTh(); };
  $("eLimp").onclick = () => pad.limpiar(); if ($("eIva")) $("eIva").onclick = () => $("eMon").value = iva; $("eNo").onclick = () => o.remove();
  $("eSi").onclick = () => { const conRec = est !== "aus";
    if (conRec && (est === "ok" || est === "parcial") && pad.vacio()) { toast("Falta la firma de recepción conforme."); return; }
    if (conRec && (est === "ok" || est === "parcial") && !$("eNom").value.trim()) { toast("Escribe el nombre de quien recibe."); return; }
    if ((est === "rech" || est === "aus" || est === "parcial") && !$("eObs").value.trim()) { toast("Explica en la observación qué pasó."); return; }
    const P = perfil(), d = new Date(), e = { id: "E" + P.veh + "-" + p.id + "-" + Date.now().toString(36), fecha: hoy(), hora: d.toTimeString().slice(0, 5), veh: P.veh, vehNombre: vehNom(P.veh), chofer: P.chofer,
      parada: p.id, cli: p.cli, num: p.num || "", estado: ESTXT[est], recibe: conRec ? $("eNom").value.trim() : "", rut: conRec ? $("eRut").value.trim() : "", pago: conRec ? $("ePago").value : "", monto: conRec ? Number($("eMon").value) || 0 : 0,
      obs: $("eObs").value.trim(), lat: POS ? POS.lat : "", lng: POS ? POS.lng : "", fotos: fotos.slice(), firma: conRec && !pad.vacio() ? pad.png() : "" };
    const C = cola(); C.push(e); if (!lsSet("cola", C)) return; const E = estados(); E[p.id] = { est, hora: e.hora, pago: e.pago, monto: e.monto }; lsSet("est_" + hoy(), E);
    o.remove(); toast("Entrega guardada."); pintar(SEC); enviarCola(); gpsEnviar(true); }; }

/* ===== pantallas ===== */
let SEC = "ruta";
function ir(s) { SEC = s; document.querySelectorAll("main > section").forEach(x => x.hidden = x.id !== "s-" + s); document.querySelectorAll("#nav [data-s]").forEach(b => b.setAttribute("aria-current", b.dataset.s === s)); pintar(s); window.scrollTo({ top: 0 }); }
$("nav").onclick = e => { const b = e.target.closest("[data-s]"); if (b) ir(b.dataset.s); };
function pintar(s) { ({ ruta: pintarRuta, mapa: pintarMapa, resumen: pintarResumen })[s](); }
const navUrl = p => `https://www.google.com/maps/dir/?api=1${POS ? `&origin=${POS.lat},${POS.lng}` : ""}&destination=${p.lat},${p.lng}&travelmode=driving`;
const telNorm = t => String(t || "").replace(/[^\d+]/g, ""), waNorm = t => { const d = String(t || "").replace(/\D/g, ""); return d.length === 9 ? "56" + d : d; };

        ent.sort((a, b) => String(a.hora).localeCompare(String(b.hora)));
        return { ok: true, fecha: d.fecha, gps, entregas: ent, recorrido: {}, jornadas: jor, puente: true }; }

    return async function (d, real) {
