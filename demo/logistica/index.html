function deAdmin(v, p) { const B = p.BASE || {}; if (!B.rows) return null; const tv = (B.vend || []).indexOf("Tienda Hellywoof"), cy = Number(String(B.corte).slice(0, 4)), cm = Number(String(B.corte).slice(5, 7)), meses = [];

    (r[7] === tv ? o.t : o.d)[j] += r[4] || 0; (r[7] === tv ? o.tv : o.dv)[j] += r[5] || 0; if (r[4] > 0 && r[6] > 0) { o.c += r[4] * r[6]; o.q += r[4]; } });

function kgDe(n) { const s = String(n || "").toUpperCase().replace(",", "."); let kg = 0; const k = /(\d+(?:\.\d+)?)\s*(KG|KILOS?)\b/.exec(s), g = /(\d+(?:\.\d+)?)\s*(GRS?|GRAMOS|G)\b/.exec(s);

  let L = invFilas(invB); const val = L.reduce((t, x) => t + x.valor, 0), sin = L.filter(x => x.stock <= 0 && x.q > 0), baj = L.filter(x => x.stock > 0 && x.q > 0 && x.dias < 7), quieto = L.filter(x => x.stock > 0 && !(x.q > 0));

    ${porB.map(x => `<tr><td><b>${esc(x.b)}</b></td><td>${mm(x.val)}</td><td>${x.dias ? nf(x.dias) : "—"}</td><td class="${x.sin ? "bad" : ""}">${x.sin}</td><td class="${x.baj ? "wa" : ""}">${x.baj}</td></tr>`).join("")}</tbody></table></div></div>

<script id="hwfVerJs">/* sello_version: aviso de versión nueva */
const HWF_VER = "20261110082034";
(function () {
  const raiz = location.pathname.replace(/\/(demo\/)?(ventas|admin|tienda|logistica|chofer)\/[^/]*$/, "/");
  let avisado = false;
  async function revisar() {
    if (avisado || !navigator.onLine) return;
    try { const r = await fetch(raiz + "version.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return; const j = await r.json();
      if (j && j.v && String(j.v) > HWF_VER) mostrar(j); } catch (e) {}
  }
  function mostrar(j) { avisado = true; const d = document.createElement("div"); d.id = "hwfVer";
    d.innerHTML = `<span style="white-space:nowrap">Nueva versión disponible</span><button type="button">Actualizar</button>`;
    d.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);top:calc(34px + env(safe-area-inset-top));white-space:nowrap;z-index:10000;background:#0B3146;color:#fff;border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);font:600 .88rem system-ui,sans-serif;max-width:calc(100vw - 24px)";

    b.onclick = async () => { b.textContent = "Actualizando…"; try { const rs = await navigator.serviceWorker?.getRegistrations?.(); if (rs) await Promise.all(rs.map(x => x.update().catch(() => {}))); } catch (e) {} location.reload(); };

})();
