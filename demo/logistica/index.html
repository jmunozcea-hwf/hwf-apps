<script>/* patch_puente */
(function () {

      <td class="${cl(i.yoy, true)}">${i.yoy == null ? "—" : sg(i.yoy)}</td><td class="bi-c">${fm(a.sv)}</td><td>${i.dias == null ? "—" : Math.round(i.dias)}</td><td>${i.rot == null ? "—" : i.rot.toLocaleString("es-CL", { maximumFractionDigits: 1 })}</td>
      <td class="bi-c">${i.gm == null ? "—" : "$" + i.gm.toLocaleString("es-CL", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td><td class="bi-c ${i.cc == null ? "" : i.cc > 1.1 ? "bi-neg" : i.cc < 0.9 ? "bi-pos" : ""}">${i.cc == null ? "—" : pc(i.cc)}</td><td class="bi-c ${cl(i.alza, false)}">${i.alza == null ? "—" : sg(i.alza)}</td></tr>`; };
    /* --- Pareto --- */
    const ps = A.L.filter(o => o.v > 0).sort((a, b) => b.v - a.v); let acc = 0, nA = 0, nB = 0; const W = 640, Hh = 200, Lm = 40, Rm = 10, Tm = 10, Bm = 24, xs = k => Lm + (W - Lm - Rm) * k, ys = k => Tm + (Hh - Tm - Bm) * (1 - k); let pts = `${xs(0)},${ys(0)} `;

    let ej = ""; [0, 0.25, 0.5, 0.75, 1].forEach(k => { ej += `<line x1="${Lm}" x2="${W - Rm}" y1="${ys(k)}" y2="${ys(k)}" stroke="#DDE3E8"/><text x="${Lm - 6}" y="${ys(k) + 4}" text-anchor="end" font-size="11" fill="#5B6874">${k * 100}%</text><text x="${xs(k)}" y="${Hh - 6}" text-anchor="middle" font-size="11" fill="#5B6874">${k * 100}%</text>`; });
    const pareto = ps.length > 3 ? `<svg class="bi-svg" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Curva de concentración de la venta">${ej}<line x1="${Lm}" x2="${W - Rm}" y1="${ys(0.8)}" y2="${ys(0.8)}" stroke="#E07B24" stroke-dasharray="5 4"/><line x1="${xs(nA / ps.length)}" x2="${xs(nA / ps.length)}" y1="${ys(0)}" y2="${ys(0.8)}" stroke="#E07B24" stroke-dasharray="5 4"/><polyline points="${pts}" fill="none" stroke="#0B3146" stroke-width="2.5"/></svg>` : "";
    const li = (l, f) => l.slice(0, 6).map(o => `<tr><td>${esc(o.n)}<small>${esc(o.cod)} · ${esc(o.grp)}</small></td><td>${f(o)}</td></tr>`).join("");
    const blo = (t, sub, l, f, cab) => l.length ? `<div><h3 style="margin:10px 0 2px;font-size:.92rem">${t} <span class="muted" style="font-weight:600">${sub}</span></h3><table class="bi-t"><thead><tr><th>Producto</th><th>${cab}</th></tr></thead><tbody>${li(l, f)}</tbody></table>${l.length > 6 ? `<p class="bi-nota" style="margin-top:4px">y ${l.length - 6} más (en el archivo descargable).</p>` : ""}</div>` : "";
    R.avz = { A, qb, sob, muerto, alz };
    return `<div class="card"><h2>Hallazgos <span class="muted">${per}${hayF && filt ? " · " + esc(filt) : ""}</span></h2>
        ${H.map(([i, t]) => `<p style="margin:7px 0;display:flex;gap:8px;font-size:.9rem"><span aria-hidden="true" style="flex:none;width:22px;height:22px;border-radius:50%;background:${i === "!" || i === "▼" ? "#FDE8E6" : "#EEF2F5"};color:${i === "!" || i === "▼" ? "#B42318" : "#0B3146"};display:grid;place-items:center;font-weight:800;font-size:.78rem">${i}</span><span>${t}</span></p>`).join("") || '<p class="muted">Sin datos suficientes.</p>'}</div>

          ${A.GL.map(a => fila(a)).join("")}${fila(Object.assign({ np: 0 }, T), true)}</tbody></table></div>
        <p class="bi-nota">${RC ? "" : "Margen = 1 − costo ÷ venta. "}vs ${E.anio - 1} = mismos meses cerrados. Días de inventario = stock ÷ venta diaria de los últimos 3 meses cerrados, siempre bodega y venta del mismo negocio (aquí: ${A.invTxt}); rotación = veces al año.${RC ? "" : " Rentabilidad del inventario = margen bruto anual por cada $1 de stock (sobre $1 es bueno). Compras ÷ costo: 100% = se repone lo que sale. Alza de costo = precio de compra de la última compra contra la primera del año."}${E.canal === "t" && !A.inv ? " <b>Tienda:</b> el stock de su bodega llegará con la próxima actualización de datos; hasta entonces inventario, días, rotación y quiebres salen con «—»." : ""}</p></div>
      ${pareto ? `<div class="card"><h2>Concentración de productos <span class="muted">curva 80/20</span></h2>${pareto}
        <div class="bi-k"><div>Clase A · 80 % de la venta<b>${nA} productos</b><small>${pc(nA / ps.length)} del surtido</small></div><div>Clase B · siguiente 15 %<b>${nB - nA} productos</b><small>${pc((nB - nA) / ps.length)} del surtido</small></div>

      ${A.hayFc && T.fv > 0 ? `<div class="card"><h2>Pronóstico 3 meses <span class="muted">${MES[A.cm - 1]}–${MES[(A.cm + 1) % 12]} · por ${que}</span></h2>
        <div class="tbl" style="overflow-x:auto"><table class="bi-t"><thead><tr><th>${que[0].toUpperCase() + que.slice(1)}</th><th>Venta esperada</th><th class="bi-c">Costo de esa venta</th><th class="bi-c">Stock a costo</th><th>Cobertura</th></tr></thead><tbody>
          ${A.GL.filter(a => a.fv > 0).map(a => { const i = ind(a), co = a.v > 0 ? a.fv * a.c / a.v : 0; return `<tr><td>${esc(a.n)}</td><td>${fm(a.fv)}</td><td class="bi-c">${fm(co)}</td><td class="bi-c">${fm(a.sv)}</td><td class="${i.cob == null ? "" : i.cob < 0.5 ? "bi-neg" : ""}">${i.cob == null ? "—" : i.cob.toLocaleString("es-CL", { maximumFractionDigits: 1 }) + " meses"}</td></tr>`; }).join("")}
          <tr class="tot"><td>Total</td><td>${fm(T.fv)}</td><td class="bi-c">${fm(T.v > 0 ? T.fv * T.c / T.v : 0)}</td><td class="bi-c">${fm(T.sv)}</td><td>${IT.cob == null ? "—" : IT.cob.toLocaleString("es-CL", { maximumFractionDigits: 1 }) + " meses"}</td></tr></tbody></table></div>
        <p class="bi-nota">Venta esperada = pronóstico por producto (el mismo de Abastecimiento) llevado a la meta del plan de la distribuidora de los próximos 3 meses, más la venta base de la tienda. Cobertura = meses de la venta esperada que cubre el stock (${A.invTxt}; en rojo, menos de medio mes). La compra producto a producto está en Más → Abastecimiento.</p></div>` : ""}`; }
  function poner() { const s = HOST.cont(); if (!s) return; const viejo = s.querySelector("#biSeg"); if (viejo) viejo.remove(); const vb = s.querySelector("#biBox"); if (vb) vb.remove();
    [...s.children].forEach(c => c.classList.toggle("bi-oculto", !!E.on));

    s.querySelector("#biSeg").onclick = e => { const b = e.target.closest("[data-bi]"); if (!b) return; E.on = b.dataset.bi === "1"; guarda(); poner(); };
    if (!E.on) return;
    let R; try { R = calc(); } catch (e) { s.insertAdjacentHTML("beforeend", '<div id="biBox"><div class="card"><p class="muted">No se pudo calcular: ' + esc(String(e && e.message || e)) + "</p></div></div>"); return; }
    s.insertAdjacentHTML("beforeend", '<div id="biBox">' + sinC(html(R) + avzHtml(R)) + "</div>"); const q = id => s.querySelector("#" + id);
    q("biU").onclick = e => { const b = e.target.closest("[data-u]"); if (b) { E.u = b.dataset.u; guarda(); poner(); } };

    q("biProv").onchange = () => { E.prov = q("biProv").value; E.marca = E.prod = ""; guarda(); poner(); };
    q("biMarca").onchange = () => { E.marca = q("biMarca").value; E.prod = ""; guarda(); poner(); };
    q("biFmt").onchange = () => { E.fmt = q("biFmt").value; E.prod = ""; guarda(); poner(); };

    if (q("biLimpia")) q("biLimpia").onclick = () => { E.prov = E.marca = E.fmt = E.prod = ""; guarda(); poner(); };
    if (q("biAnio")) q("biAnio").onchange = () => { E.anio = Number(q("biAnio").value); guarda(); poner(); };
    if (q("biTodos")) q("biTodos").onclick = () => { if (E.prod) E.prod = ""; else if (E.marca) E.marca = ""; else if (E.fmt && !E.prov) E.fmt = ""; else if (E.prov) E.prov = ""; else E.fmt = ""; guarda(); poner(); };

    s.querySelectorAll("tr[data-bp]").forEach(tr => tr.onclick = () => { const v = tr.dataset.bp, n = R.nv; if (n === "proveedor") E.prov = v; else if (n === "marca") E.marca = v; else E.prod = v; guarda(); poner(); window.scrollTo({ top: 0 }); }); }
