const geoMem = () => lsGet("geo", {});
function comunaLL(c) { const k = norm(c).replace(/\./g, "").replace(/\s+/g, " "); return COMUNAS[k] || COMUNAS[k.replace(/ de .*$/, "")] || null; }
function ubic(cli, comuna) { const g = geoMem()[norm(cli)]; if (g) return { lat: g[0], lng: g[1], fuente: g[2] === "comuna" ? "comuna" : g[2] || "exacta" }; const c = comunaLL(comuna); return c ? { lat: c[0], lng: c[1], fuente: "comuna" } : null; }
const R_T = 6371, rad = x => x * Math.PI / 180;

  for (const p of paradas) { if (G[norm(p.cli)] || !p.dir) continue; n++; onP && onP(n);
    try { const q = encodeURIComponent(`${p.dir}, ${p.comuna}, Chile`); const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=cl&q=${q}`, { headers: { "Accept-Language": "es" } }); const j = await r.json();
      if (j && j[0]) { const ll = { lat: +j[0].lat, lng: +j[0].lon }, c = comunaLL(p.comuna); if (!c || hav(ll, { lat: c[0], lng: c[1] }) < 40) { G[norm(p.cli)] = [+ll.lat.toFixed(6), +ll.lng.toFixed(6), "exacta"]; ok++; } } } catch (e) {}
    await new Promise(r => setTimeout(r, 1100)); }   /* OpenStreetMap: máximo 1 consulta por segundo */
  lsSet("geo", G); return { n, ok }; }

<script>/* patch_puente */
(function () {
  const ACC = ["rutaGuardar", "rutaLeer", "gps", "entrega", "logEstado", "jornada"], K = "hwf-puente";
  let st = {}; try { st = JSON.parse(localStorage.getItem(K)) || {}; } catch (e) {}
  const guarda = () => { try { localStorage.setItem(K, JSON.stringify(st)); } catch (e) {} };
  const z = n => String(n).padStart(2, "0"), hoyL = () => { const d = new Date(); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`; };
  const okF = f => /^\d{4}-\d\d-\d\d$/.test(String(f || "")) ? String(f) : hoyL(), ts = () => Math.floor(Date.now() / 1000);
  const desconocida = r => r && r.ok === false && /desconocid/i.test(String(r.error || ""));
  const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s)));
  const corta = (s, n) => String(s == null ? "" : s).slice(0, n);
  /* fotos y firma pendientes (IndexedDB) */
  const idb = () => new Promise((ok, no) => { try { const q = indexedDB.open("hwf-puente", 1); q.onupgradeneeded = () => q.result.createObjectStore("ent"); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); } catch (e) { no(e); } });
  const idbPut = async (k, v) => { try { const db = await idb(); await new Promise(r => { const t = db.transaction("ent", "readwrite"); t.objectStore("ent").put(v, k); t.oncomplete = r; t.onerror = r; }); } catch (e) {} };
  const idbAll = async () => { try { const db = await idb(); return await new Promise(r => { const t = db.transaction("ent"), s = t.objectStore("ent"), out = []; const c = s.openCursor(); c.onsuccess = () => { const x = c.result; if (x) { out.push([x.key, x.value]); x.continue(); } else r(out); }; c.onerror = () => r(out); }); } catch (e) { return []; } };
  const idbDel = async k => { try { const db = await idb(); await new Promise(r => { const t = db.transaction("ent", "readwrite"); t.objectStore("ent").delete(k); t.oncomplete = r; t.onerror = r; }); } catch (e) {} };
  function instalar(nombre, llamar) {
    let subiendo = false;
    async function subirPendientes() { if (subiendo) return; subiendo = true;
      try { for (const [k, e] of await idbAll()) { const r = await llamar({ accion: "entrega", entrega: e }); if (desconocida(r)) break; if (r && r.ok) await idbDel(k); } } catch (e) {} subiendo = false; }
    const pt = (fecha, clave, v, det) => llamar({ accion: "puntaje", puntaje: { fecha: okF(fecha), vendedor: clave, puntos: v, max: 0, cumplidas: 0, misiones: 0, detalle: det } });
    async function filas(fecha) { const r = await llamar({ accion: "ranking", desde: okF(fecha) }); return r && r.ok ? (r.filas || []).filter(f => f[0] === okF(fecha) && String(f[1]).charAt(0) === "~") : null; }
    const J = s => { try { return JSON.parse(s); } catch (e) { return null; } };
    function leerRuta(F) { const por = {};
      F.filter(f => /^~R\|\d+$/.test(f[1])).forEach(f => { const m = /^(\d+)\|(\d+)\|(.*)$/.exec(f[6]); if (!m) return; const v = m[1], i = Number(f[1].split("|")[1]); (por[v] = por[v] || { n: Number(m[2]), p: {} }).p[i] = m[3]; });
      const vs = Object.keys(por).sort((a, b) => b - a);
      for (const v of vs) { const o = por[v]; let s = ""; for (let i = 0; i < o.n; i++) { if (o.p[i] == null) { s = null; break; } s += o.p[i]; } if (s != null) { try { return JSON.parse(b64d(s)); } catch (e) {} } }
      return null; }
    async function puente(d) {
      if (d.accion === "gps") return pt(hoyL(), "~G|" + corta(d.veh, 20), ts(), JSON.stringify({ c: corta(d.chofer, 40), a: +(+d.lat).toFixed(6), o: +(+d.lng).toFixed(6), p: Math.round(+d.acc || 0), s: +d.vel || 0, t: new Date().toISOString() }));
      if (d.accion === "rutaGuardar") { const s = b64e(JSON.stringify(d.rutas || [])), N = 850, n = Math.max(1, Math.ceil(s.length / N)), v = ts();
        for (let i = 0; i < n; i++) { const r = await pt(d.fecha, "~R|" + i, v, v + "|" + n + "|" + s.slice(i * N, (i + 1) * N)); if (!r || !r.ok) return { ok: false, error: "No se pudo enviar la ruta (parte " + (i + 1) + " de " + n + "). Intenta de nuevo." }; }
        return { ok: true, fecha: d.fecha, rutas: (d.rutas || []).length, paradas: (d.rutas || []).reduce((t, x) => t + (x.paradas || []).length, 0), puente: true }; }
      if (d.accion === "rutaLeer") { const F = await filas(d.fecha); if (!F) return { ok: false, error: "Sin conexión con el script." }; const R = leerRuta(F); return R ? { ok: true, fecha: d.fecha, ruta: { fecha: d.fecha, rutas: R }, puente: true } : { ok: true, vacio: true }; }
      if (d.accion === "entrega") { const e = d.entrega || {}, id = corta(e.id || ("E" + Date.now()), 60);
        let o = { id, h: corta(e.hora, 8), v: corta(e.vehNombre || e.veh, 30), c: corta(e.chofer, 30), p: e.parada, cl: corta(e.cli, 80), n: corta(e.num, 20), e: corta(e.estado, 20), r: corta(e.recibe, 50), pg: corta(e.pago, 30), m: Number(e.monto) || 0, o: corta(e.obs, 160), f: (e.fotos || []).length, fi: e.firma ? 1 : 0, la: e.lat, lo: e.lng };
        let s = JSON.stringify(o); if (s.length > 880) { o.o = corta(o.o, 40); o.cl = corta(o.cl, 40); s = JSON.stringify(o).slice(0, 880); }
        const r = await pt(e.fecha, "~E|" + id, ts(), s); if (r && r.ok && ((e.fotos || []).length || e.firma)) await idbPut(id, e);
        return r && r.ok ? { ok: true, id, puente: true } : r; }
      if (d.accion === "jornada") { const j = d.jornada || {}, id = corta(j.id, 60); if (!id) return { ok: false, error: "Jornada sin identificador." };
        const o = { id, f: okF(j.fecha), c: corta(j.chofer, 40), v: corta(j.vehNombre || j.veh, 40), i: corta(j.inicio, 8), t: corta(j.fin, 8), h: +j.horas || 0, kg: +j.kmGps || 0, oi: j.odoIni, of: j.odoFin, ko: +j.kmOdo || 0, en: corta(j.entregas, 20), co: +j.cobrado || 0, li: +j.litros || 0, cb: +j.comb || 0, ob: corta(j.obs, 200), ac: j.activa ? 1 : 0 };
        const r = await pt(j.fecha, "~J|" + id, ts(), JSON.stringify(o)); return r && r.ok ? { ok: true, id, puente: true } : r; }
      if (d.accion === "logEstado") { const F = await filas(d.fecha); if (!F) return { ok: false, error: "Sin conexión con el script." };
        const gps = {}, ent = [], jor = [];
        F.forEach(f => { const k = String(f[1]), x = J(f[6]); if (!x) return;
          if (k.startsWith("~G|")) { const veh = k.slice(3); gps[veh] = { veh, chofer: x.c, lat: x.a, lng: x.o, acc: x.p, vel: x.s, ts: x.t }; }
          else if (k.startsWith("~E|")) ent.push({ id: x.id, hora: x.h, veh: x.v, chofer: x.c, parada: x.p, cli: x.cl, num: x.n, estado: x.e, recibe: x.r, pago: x.pg, monto: x.m, obs: x.o, fotos: x.f ? x.f + " (pendientes de subir)" : "", firma: x.fi ? "pendiente de subir" : "" });
          else if (k.startsWith("~J|")) jor.push({ id: x.id, chofer: x.c, veh: x.v, inicio: x.i, fin: x.t, horas: x.h, kmGps: x.kg, odoIni: x.oi, odoFin: x.of, kmOdo: x.ko, entregas: x.en, cobrado: x.co, litros: x.li, comb: x.cb, obs: x.ob, activa: !!x.ac }); });
        ent.sort((a, b) => String(a.hora).localeCompare(String(b.hora)));

      return { ok: false, error: "Acción desconocida." }; }
    return async function (d, real) {
      if (!d || ACC.indexOf(d.accion) < 0) return real();
      const usar = st.on && Date.now() - (st.t || 0) < 30 * 60000;
      if (!usar) { const r = await real(); if (!desconocida(r)) { if (st.on) { st = {}; guarda(); } if (r && r.ok) subirPendientes(); return r; } st = { on: true, t: Date.now() }; guarda(); }

<script>/* patch_menusel: grupos de filtros → menú desplegable */
(function () {
  const SEL = '.seg, .pr-chips, .cx-chips, .rk-seg, .pra-seg, .pt-seg, .db-seg, .ad-seg, .nu-tabs, .tc-tabs, .t-seg, #prFil, #prSegF, #cxFil, #cxSegF, #invSeg, #proSeg, #bnSegAp, [role=tablist]';
  const FUERA = "#masSeg, #snPanel, #snPanLog, nav, .modos, #tNav, .ms-hoja, header, .auth-body, #auth, .login";
  const activo = b => b.getAttribute("aria-pressed") === "true" || b.getAttribute("aria-selected") === "true" || /(^|\s)(on|act|activo|active|sel)(\s|$)/.test(b.className);
  const botones = g => [...g.children].filter(b => b.tagName === "BUTTON" && b.style.display !== "none" && !b.hidden);
  const txt = b => (b.textContent || "").replace(/\s+/g, " ").trim();
  let nc = 0;
  const cont = b => { const c = b.cloneNode(true); let h = c.innerHTML; nc++;
    [...c.querySelectorAll("[id]")].forEach(x => { const id = x.id, nu = id + "-ms" + nc; h = h.split('id="' + id + '"').join('id="' + nu + '"').split("#" + id + ")").join("#" + nu + ")"); });
    return h; };
  function titulo(g) {
    const l = g.getAttribute("aria-label"); if (l) return l;
    let p = g.previousElementSibling; while (p && p.classList.contains("ms-btn")) p = p.previousElementSibling;
    if (p && /^(H2|H3|LABEL)$/.test(p.tagName) && txt(p).length < 40) return txt(p);
    return "Ver";
  }
  let velo, hoja, abierto = null;
  function cerrar() { if (!hoja) return; hoja.classList.remove("on"); velo.classList.remove("on"); setTimeout(() => { if (!abierto) { velo.remove(); hoja.remove(); velo = hoja = null; } }, 230); abierto = null; }
  function abrir(g, btn) {
    if (!velo) { velo = document.createElement("div"); velo.className = "ms-velo"; velo.onclick = cerrar; hoja = document.createElement("div"); hoja.className = "ms-hoja"; hoja.setAttribute("role", "dialog"); hoja.setAttribute("aria-modal", "true"); document.body.append(velo, hoja); }
    abierto = g; const bs = botones(g);
    hoja.innerHTML = `<div class="ms-asa"></div><h3>${btn.querySelector("small").textContent}</h3>` + bs.map((b, i) => `<button type="button" class="ms-op" data-i="${i}" aria-current="${activo(b)}">${cont(b)}${activo(b) ? '<span class="ms-ok">✓</span>' : ""}</button>`).join("");
    hoja.querySelectorAll(".ms-op").forEach(o => o.onclick = () => { const b = bs[Number(o.dataset.i)]; cerrar(); if (b && b.isConnected) b.click(); setTimeout(() => pintar(g), 30); });
    requestAnimationFrame(() => { velo.classList.add("on"); hoja.classList.add("on"); const a = hoja.querySelector('[aria-current="true"]'); if (a) a.focus(); });
  }
  document.addEventListener("keydown", e => { if (e.key === "Escape" && abierto) cerrar(); });
  function pintar(g) {
    const btn = g._msBtn; if (!btn) return; const bs = botones(g); const a = bs.filter(activo);
    const b = a[0] || bs[0]; if (!b) return;
    btn.querySelector("b").innerHTML = cont(b);
    btn.querySelector(".ms-n").textContent = bs.length + " opciones";
  }
  function convertir(g) {
    if (g._msBtn || g.closest(FUERA) || g.closest(".ms-oc")) return;
    const bs = botones(g); if (bs.length < 2 || bs.filter(activo).length > 1 || bs.length !== g.children.length) return;
    const btn = document.createElement("button"); btn.type = "button"; btn.className = "ms-btn"; btn.setAttribute("aria-haspopup", "dialog");
    btn.innerHTML = `<span class="ms-t"><small>${titulo(g).replace(/[<>&]/g, "")}</small><b></b></span><span class="ms-n"></span><span class="ms-a">▼</span>`;
    btn.onclick = () => abrir(g, btn);
    g._msBtn = btn; g.parentNode.insertBefore(btn, g); g.classList.add("ms-oc");
    new MutationObserver(() => pintar(g)).observe(g, { subtree: true, childList: true, attributes: true, attributeFilter: ["aria-pressed", "aria-selected", "class"] });
    pintar(g);
  }
  function aplicar() {
    try {
      document.querySelectorAll(".ms-btn").forEach(b => { const g = b.nextElementSibling; if (!g || g._msBtn !== b) b.remove(); });
      document.querySelectorAll(SEL).forEach(convertir);
    } catch (e) {}
  }
  aplicar(); setTimeout(aplicar, 500); setTimeout(aplicar, 1600);
  let pend = false; new MutationObserver(() => { if (pend) return; pend = true; setTimeout(() => { pend = false; aplicar(); }, 60); }).observe(document.body, { childList: true, subtree: true });
})();
</script>

<script>/* patch_menuorden: menús reordenados y agrupados */
(function () {
  const VEN = typeof NAV_ORDEN !== "undefined" && typeof setModo === "function" && !!document.getElementById("mInicio"), ADM = !VEN && !!document.querySelector("nav.bottom") && !!document.getElementById("s-res");
  const LOG = !VEN && !ADM && !!document.querySelector('#nav [data-s="rutas"]'), TND = !VEN && !ADM && !!document.getElementById("tNav");
  const GV = [["Mi día", ["inicio", "pedido", "clientes", "agenda", "ruta", "cobranza", "embudo", "cat"]], ["Equipo", ["act"]], ["Análisis", ["dash", "avance", "bi", "eerr"]], ["Aprender", ["nut", "tec"]]];
  const GA = [["Dirección", ["t:hal"]], ["Equipo", ["m:actividades"]], ["Ventas", ["t:res", "t:ven", "t:cli", "t:pro", "m:ranking", "m:plan", "m:zonas", "m:terreno", "m:bonif"]], ["Pedidos y cobranza", ["m:cots", "m:napp", "m:cobranza", "m:embudo"]],
    ["BI y compras", ["b:v", "b:l", "t:mar", "m:eerr", "m:abast", "m:provee"]], ["Web y portal B2B", ["m:metricas", "m:instagram", "m:b2b", "m:mail", "m:invita", "m:roi"]], ["Archivos y datos", ["m:catalogo", "m:cambios", "m:datos"]]];   /* 22-11-2026: métricas web y B2B en su propio grupo */
  const pos = (G, k) => { let n = 0; for (const [, l] of G) { const i = l.indexOf(k); if (i >= 0) return n + i; n += l.length; } return 999; };
  if (VEN) { const ord = () => { const a = NAV_ORDEN.slice(); a.sort((x, y) => pos(GV, x[0]) - pos(GV, y[0])); NAV_ORDEN.splice(0, NAV_ORDEN.length, ...a); };
    ord(); setTimeout(ord, 0); setTimeout(ord, 1500);   /* BI, Catálogos y Técnicas se agregan al cargar */ }
  /* títulos de grupo en el menú lateral (VENTAS y HWF) */
  function grupos() { const pan = document.getElementById("snPanel"); if (!pan || pan.querySelector(":scope > .sn-g")) return;
    const items = [...pan.querySelectorAll(":scope > .sn-i")]; if (!items.length) return; if (ADM && pan.querySelector('.sn-i[data-t="inv"]:not([data-biu])')) return;   /* espera a que BI reemplace Inventario */
    pan.querySelectorAll(":scope > .sn-g").forEach(x => x.remove());
    const key = b => VEN ? b.dataset.sm : b.dataset.biu ? "b:" + b.dataset.biu : b.dataset.t ? "t:" + b.dataset.t : "m:" + b.dataset.m, G = VEN ? GV : GA;
    if (ADM) { const ico = s => { const x = pan.querySelector(s + " .sn-e"); return x ? x.innerHTML : ""; };   /* íconos que faltaban */
      { const e = pan.querySelector('[data-m="metricas"] .sn-e'); if (e && e.textContent.trim() === "•") e.textContent = "📈"; }
      [["m:provee", '[data-m="cobranza"]'], ["m:catalogo", '[data-m="cots"]']].forEach(([k, s]) => { const it = items.find(b => key(b) === k), e = it && it.querySelector(".sn-e"); if (e && e.textContent.trim() === "•") e.innerHTML = ico(s) || "•"; }); const bv = items.find(b => key(b) === "b:v"), ev = bv && bv.querySelector(".sn-e"), pl = ico('[data-m="plan"]'); if (ev && pl) ev.innerHTML = pl; }
    items.sort((a, b) => pos(G, key(a)) - pos(G, key(b))); let g0 = -1, n = 0;
    items.forEach(b => { const p = pos(G, key(b)); let gi = -1, acc = 0; G.forEach(([, l], i) => { if (p >= acc && p < acc + l.length) gi = i; acc += l.length; }); if (gi < 0) gi = G.length;
      if (gi !== g0) { const h = document.createElement("div"); h.className = "sn-g" + (n ? "" : " sn-g0"); h.textContent = gi < G.length ? G[gi][0] : "Otros"; pan.appendChild(h); g0 = gi; n++; } pan.appendChild(b); });
  }
  if (VEN || ADM) { const sn = () => document.getElementById("snPanel"); const mo = new MutationObserver(() => setTimeout(grupos, 0)); const t = setInterval(() => { if (sn()) { mo.observe(sn(), { childList: true }); clearInterval(t); } }, 300); }
  /* barras inferiores */
  const barra = (sel, orden) => { const nav = document.querySelector(sel); if (!nav) return; const bs = [...nav.querySelectorAll(":scope > button")], k = b => b.dataset.biu ? "b:" + b.dataset.biu : b.dataset.s;
    bs.sort((a, b) => { const i = orden.indexOf(k(a)), j = orden.indexOf(k(b)); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); }).forEach(b => nav.appendChild(b)); };
  if (LOG) { const o = ["dash", "rutas", "seg", "flota", "abast", "b:v", "b:l"]; barra("#nav", o); setTimeout(() => barra("#nav", o), 500); }
  if (TND) { const o = ["inicio", "ventas", "stock", "cat", "plan", "dash", "guia", "nut", "rank", "adm"]; barra("#tNav", o); setTimeout(() => barra("#tNav", o), 500); }
})();
</script>
